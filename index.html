<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <h1>Weather App</h1>
            <p class="subtitle">Real-time conditions, rain outlook, and five day forecast.</p>
        </header>

        <section class="search-panel">
            <form id="searchForm" class="search-form" novalidate>
                <label class="sr-only" for="cityName">City name</label>
                <input type="text" id="cityName" placeholder="Search city (e.g., Tokyo)" autocomplete="off">
                <button type="submit">Search</button>
            </form>

            <div class="action-row">
                <button type="button" id="currentLocationBtn" class="ghost-btn">Use current location</button>
                <button type="button" id="unitToggleBtn" class="ghost-btn" aria-pressed="false">Switch to °F</button>
            </div>

            <div id="recentSearches" class="recent-searches" aria-live="polite"></div>
        </section>

        <section id="statusMessage" class="status-message" aria-live="assertive"></section>

        <section id="weatherInfo" class="weather-grid" aria-live="polite"></section>
    </main>

    <div id="popup" class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
        <div class="popup-content">
            <button type="button" class="close-btn" aria-label="Close">&times;</button>
            <h2 id="popupTitle">Thanks for trying Weather App 🌤️</h2>
            <p>Tip: save time by using the “current location” button and quick city chips.</p>
            <a href="https://www.instagram.com/simply.sai_krishna/" target="_blank" rel="noopener noreferrer">Follow for updates</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
